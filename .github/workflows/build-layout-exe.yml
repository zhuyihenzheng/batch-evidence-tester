name: Build Layout Generator EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-layout-exe.yml"
      - "build_layout_exe.bat"
      - "layout_txt.spec"
      - "layout_txt_exe.py"
      - "layout_txt_version_info.txt"
      - "pyinstaller_compat.py"
      - "requirements-build-py36.txt"
      - "requirements-build-modern.txt"
      - "src/autotest/layout_tar.py"
      - "src/autotest/layout_txt.py"
      - "src/autotest/layout_txt_gui.py"
      - "src/autotest/layout_txt_settings.py"
      - "tests/test_layout_txt.py"
      - "tests/test_layout_tar.py"
      - "tests/test_gui.py"
      - "tests/test_layout_txt_exe.py"
      - "tests/test_layout_txt_settings.py"
      - "tests/test_pyinstaller_compat.py"

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.11"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build-py36.txt
            requirements-build-modern.txt

      - name: Install runtime and test dependencies
        shell: cmd
        run: >-
          python -m pip install
          openpyxl==3.0.10
          Pillow==9.5.0
          PyYAML==6.0.2
          pytest==7.4.4

      - name: Run Layout generator tests
        shell: cmd
        run: >-
          python -m pytest
          tests\test_layout_txt.py
          tests\test_layout_tar.py
          tests\test_gui.py
          tests\test_layout_txt_exe.py
          tests\test_pyinstaller_compat.py
          -q

      - name: Build and smoke-test EXE
        shell: cmd
        run: build_layout_exe.bat --install

      - name: Build and smoke-test single-file EXE
        shell: cmd
        run: build_layout_exe.bat --onefile

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: LayoutTxtGenerator-windows-x64
          path: dist/LayoutTxtGenerator
          if-no-files-found: error
          retention-days: 30

      - name: Upload single-file Windows application
        uses: actions/upload-artifact@v4
        with:
          name: LayoutTxtGenerator-windows-x64-onefile
          path: dist/LayoutTxtGenerator.exe
          if-no-files-found: error
          retention-days: 30
