# =============================================================================
# {case_id} 正常系
#
#   autotest new で生成したひな形。このままでも実行できる状態にしてある。
#   次の 4 つを埋めれば正式なケースになる:
#     1. cases/{case_id}/input/ に投入ファイルを置き、下の input_files に書く
#     2. snapshot.tables に、確認したいテーブルの SELECT を書く
#     3. collect に、保全・画像化したい成果ファイルを書く
#     4. review に、人が証跡を見て OK/NG を決める確認観点を書く
#
#   assert は任意。期待値との自動比較が必要な項目だけ追加する。
#   review だけでも batch 実行・証跡採取・Excel の人工確認欄まで成立する。
# =============================================================================
id: {case_id}
name: "正常系：（ここにケース名を書く）"
description: "（何がどうなれば合格かを 1 文で書く。証跡 Excel にそのまま出る）"
tags: [正常系]
enabled: false            # ← 準備ができたら true にする
# ↑ 生成直後は false。投入ファイルを置き、下の定義を埋めてから true にすること。
#   （false のうちは validate / run の対象外なので、作りかけでも他のケースを止めない）

# --- 前処理 -------------------------------------------------------------------
setup:
  # settings.paths の論理名でのみ指定できる（生パス指定は不可 = 誤削除防止）
  clean_dirs: [input_dir, processed_dir, error_dir, output_dir]

  # DB を試験前提の状態に戻す SQL（不要なら丸ごと消す）
  # sql:
  #   - file: sql/{case_id}_setup.sql

  # テストデータの投入。src は cases/{case_id}/ からの相対パス（ファイル・フォルダ対応）
  input_files:
    - src: "input/（投入ファイル名）.csv"
      dest_dir: input_dir
      # rename: "DATA_{date}.csv"     # ファイル・フォルダを投入時に改名（{date} 使用可）

  # 投入ファイルと設定差し替えが完了した後、主 batch より前に実行する前置 batch。
  # settings.yaml の batches.<名前> を指定する。同じ batch を複数回並べてもよい。
  # YAML 上の項目順に関係なく、input_files / replace_files の後に必ず実行される。
  # batches:
  #   - batch: prepare
  #     args: ["--date", "{date}"]
  #     expected_exit_code: 0          # 省略時は 0
  #   - batch: prepare                 # 同じ batch の 2 回目
  #     args: ["--date", "{date-1}"]

# --- DB スナップショット（実行前後の 2 時点を取得）-------------------------------
# snapshot:
#   tables:
#     - name: T_SAMPLE
#       sql: "SELECT RECORD_ID, VALUE_A, VALUE_B, STATUS FROM T_SAMPLE ORDER BY RECORD_ID"
#       # mask: [PRIVATE_VALUE]       # 非公開列は ***MASKED*** にして出す

# --- 実行 ---------------------------------------------------------------------
execute:
  args: ["--mode", "daily"]
  # batch: batch_b                    # 既定以外の .exe を使うとき（settings.batches の名前）

# --- 回収 ---------------------------------------------------------------------
collect:
  files:
    - dir: output_dir
      pattern: "*.csv"
      preview: true                   # 中身も証跡画像として残す

# --- 人工確認観点 -------------------------------------------------------------
# Excel に 1 観点 1 行で出力され、確認者が OK/NG・確認者・確認日を記入する。
review:
  - "DB スナップショットの実行前後を比較し、対象レコードが期待したステータス・値になっていること"
  - |
      証跡画像と回収物を確認すること。
      出力件数・ファイル名・内容が期待結果どおりであること。
  - "実行ログを確認し、処理が完了して想定外の ERROR / Exception が出力されていないこと"

# --- 自動判定（必要な場合だけ使用）---------------------------------------------
# assert:
#   exit_code: 0
#   db:
#     - table: T_SAMPLE
#       expected: "expected/{case_id}/db_T_SAMPLE.csv"
#       key: [RECORD_ID]
#       ignore_columns: [UPDATED_AT]
#   files:
#     - name: "処理済フォルダへの移動"
#       exists: {dir: processed_dir, pattern: "*.csv", count: 1}
#   log:
#     must_contain: ["処理正常終了"]
#     must_not_contain: ["[ERROR]", "Exception", "異常終了"]
