# =============================================================================
# TC011【見本】Java（Spring Boot）batch：ジョブが COMPLETED で終わる
#
#   settings の batches.spring（type: java）で起動する。ツールが組み立てるのは
#     java [jvm_args] -jar <jar> [common_args] [execute.args]
#   ここでは demo/fake_spring_batch.py が Spring Boot の代役を務める。
#
#   ★ Spring Boot は終了コードだけで合否を決めない
#     main が System.exit(SpringApplication.exit(...)) を呼ばない作りや、.bat 経由で
#     ERRORLEVEL を返さない起動だと、ジョブが FAILED でも終了コード 0 になる。
#     assert.job_status でジョブランチャ自身が出す完了状態（BatchStatus）を必ず併用する。
# =============================================================================
id: TC011_spring_normal
name: "【見本】Spring Boot：受注取込ジョブが正常終了"
description: "orderImportJob が COMPLETED で終了し、2 件の結果ファイルが出力されること"
tags: [見本, java, 正常系]
enabled: true

setup:
  clean_dirs: [spring_input_dir, spring_processed_dir, spring_error_dir, spring_output_dir]
  input_files:
    - src: "input/ORDER_20260803.csv"
      dest_dir: spring_input_dir

execute:
  batch: spring
  # Spring Batch のジョブパラメータ（key=value）。同じ識別パラメータで完了済みだと
  # 再実行が拒否される（JobInstanceAlreadyCompleteException）点に注意
  args: ["targetDate=20260803"]

collect:
  folder_evidence: [spring_input_dir, spring_processed_dir, spring_error_dir, spring_output_dir]
  files:
    - dir: spring_output_dir
      pattern: "RESULT_*.csv"
      preview: true

assert:
  exit_code: 0
  # 完了行（Job: [...] completed ... status: [COMPLETED]）を標準出力とログから読む
  job_status: {expected: COMPLETED, job: orderImportJob}
  files:
    - name: "結果ファイルが 1 件出力されること"
      exists: {dir: spring_output_dir, pattern: "RESULT_*.csv", count: 1}
    - name: "投入ファイルが処理済へ移動していること"
      exists: {dir: spring_processed_dir, pattern: "ORDER_*.csv", count: 1}
  log:
    must_contain: ["取込件数=2"]
    must_not_contain: ["Exception"]
