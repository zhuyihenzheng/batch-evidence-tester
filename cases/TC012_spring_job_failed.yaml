# =============================================================================
# TC012【見本】Java（Spring Boot）batch：明細エラーでジョブが FAILED になる
#
#   異常系でも「落ちたこと」ではなく「どう落ちたか」を確認する。
#   job_status: FAILED は、ジョブが起動して最後まで走り、FAILED で終わったことの確認。
#   起動すらしなかった場合（同じパラメータで完了済み等）は完了行が無いので NG になる。
# =============================================================================
id: TC012_spring_job_failed
name: "【見本】Spring Boot：金額 0 の明細でジョブが FAILED"
description: "金額 0 の明細を含むとジョブが FAILED で終了し、投入ファイルがエラーフォルダへ退避されること"
tags: [見本, java, 異常系]
enabled: true

setup:
  clean_dirs: [spring_input_dir, spring_processed_dir, spring_error_dir, spring_output_dir]
  input_files:
    - src: "input/ORDER_20260803.csv"
      dest_dir: spring_input_dir

execute:
  batch: spring
  args: ["targetDate=20260803"]

collect:
  folder_evidence: [spring_input_dir, spring_error_dir, spring_output_dir]
  files:
    - dir: spring_error_dir
      pattern: "*.csv"
      preview: true

assert:
  exit_code: 1
  job_status: {expected: FAILED, job: orderImportJob}
  files:
    - name: "エラーフォルダへ退避されること"
      exists: {dir: spring_error_dir, pattern: "ORDER_*.csv", count: 1}
    - name: "結果ファイルが出力されないこと"
      exists: {dir: spring_output_dir, pattern: "RESULT_*.csv", count: 0}
  log:
    must_contain: ["明細エラー B0004"]
