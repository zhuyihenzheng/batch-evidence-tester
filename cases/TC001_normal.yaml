# =============================================================================
# TC001 正常系: 受注ファイル 1 件（明細 2 件）を正常に取り込む
# =============================================================================
id: TC001_normal
name: "正常系：受注ファイル取込（明細2件）"
description: "投入フォルダの受注 CSV が全件取り込まれ、処理済フォルダへ移動し、結果ファイルが出力されること"
tags: [正常系, 単体]
enabled: true

# --- 前処理 -------------------------------------------------------------------
setup:
  # settings.paths の論理名でのみ指定できる（生パス指定は不可 = 誤削除防止）
  #
  # クリア対象の配下に別の論理名のフォルダがある場合、そのフォルダは
  # 自動的に保護される（例: error_dir=.../Receive の下に
  # backup_dir=.../Receive/Backup がある構成でも Backup は消えない）。
  # 論理名として定義していない補助フォルダを残したいときは辞書形式で書く:
  #   clean_dirs:
  #     - input_dir
  #     - alias: error_dir
  #       exclude: ["Backup", "*.keep"]
  clean_dirs: [input_dir, processed_dir, error_dir, output_dir]

  # DB を試験前提の状態に戻す。file / inline どちらでも可
  sql:
    - file: sql/TC001_setup.sql

  # batch の設定ファイルをケース専用のものに差し替える（任意）。
  # 元ファイルは output/<run_id>/backup/<ケースID>/ へ退避し、ケース終了時に
  # 必ず元へ戻す（途中で失敗した場合も戻す）。実際に配置した内容は
  # 証跡画像として Excel に残るので、後から「どの設定で動かしたか」を追える。
  #   replace_files:
  #     - src: "config/case01.exe.config"   # cases/<id>/ からの相対
  #       dest_dir: batch_dir               # paths の論理名（差し替え先フォルダ）
  #       name: "OrderBatch.exe.config"     # 置き換える先のファイル名（省略時は src と同名）
  # ※ dest_dir を clean_dirs に入れると batch 本体まで消えるため preflight で弾く

  # テストデータの投入。src は cases/<id>/ からの相対パス
  input_files:
    - src: "input/ORDER_20260803.csv"
      dest_dir: input_dir

# --- DB スナップショット（実行前後の 2 時点を取得。画像化せず Excel の表に出す）---
#
#   まずは普通に全件（または業務日付で絞った分）を取れば十分。
#   実行前後の 2 時点を撮っているので、変化したセルは Excel 上で黄色く表示され、
#   「batch が何を書き換えたか」はそれで分かる。
#
#   SQL では次のプレースホルダが使える（必要なときだけ）:
#     {date} 系     … 業務日付（paths や引数と同じ規則。{date-1} 等も可）
#                       WHERE ORDER_DATE = '{date}'
#     {batch_start} … batch 起動直前の時刻（テスト機の時計）。
#                     全件ではなく今回触った行だけに絞りたいときに使う:
#                       WHERE UPDATED_AT >= '{batch_start}'
#                     列が char/varchar なら書式を合わせる:
#                       WHERE UPDATE_YMD >= '{batch_start:%Y%m%d}'
#                     DB への問い合わせは発生しない。時計ずれ対策として
#                     database.batch_start_margin_sec 秒だけさかのぼる。
snapshot:
  tables:
    - name: T_ORDER
      sql: >
        SELECT ORDER_ID, ORDER_NO, CUSTOMER_NM, AMOUNT, STATUS, UPDATED_AT
        FROM T_ORDER ORDER BY ORDER_ID
      # 個人情報列。比較は生値で行い、Excel へ書くときだけ ***MASKED*** にする
      # （比較前にマスクすると、値が違っても同じに見えて偽 OK になる）
      mask: []

# --- batch 実行 ---------------------------------------------------------------
execute:
  args: ["--mode", "daily", "--date", "20260803"]

# --- 成果物の回収（判定より先にコピーして保全する）-----------------------------
collect:
  files:
    - dir: output_dir
      pattern: "RESULT_*.csv"
      preview: true       # 中身を画像化して証跡に貼る
    - dir: processed_dir
      pattern: "*.csv"
      preview: false

# --- 判定 ---------------------------------------------------------------------
assert:
  exit_code: 0

  db:
    - table: T_ORDER
      expected: "expected/TC001_normal/db_T_ORDER.csv"
      key: [ORDER_ID]
      ignore_columns: [UPDATED_AT]   # 実行時刻依存の列は比較対象外

  files:
    - name: "結果ファイル RESULT_20260803.csv"
      actual: {dir: output_dir, pattern: "RESULT_*.csv"}
      expected: "expected/TC001_normal/RESULT_20260803.csv"
      encoding: utf-8
    - name: "処理済フォルダへの移動"
      exists: {dir: processed_dir, pattern: "ORDER_*.csv", count: 1}
    - name: "エラーフォルダが空であること"
      exists: {dir: error_dir, pattern: "*", count: 0}
    - name: "投入フォルダが空であること"
      exists: {dir: input_dir, pattern: "*", count: 0}

  log:
    must_contain: ["処理開始", "取込件数=2", "処理正常終了"]
    must_not_contain: ["[ERROR]", "Exception", "異常終了"]
